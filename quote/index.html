<!DOCTYPE html>
<html lang="en" style="background:#192d54">
<head>
  <meta charset="utf-8">
  <meta name="facebook-domain-verification" content="kcwqzrbr8dqkp8t2dxts8i8a667x19">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Estimate Form — Even Solutions</title>
  <meta name="description" content="Request a free home remodeling estimate from Even Solutions in about 30 seconds.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#192d54">
  <link rel="icon" type="image/svg+xml" href="/images/logo-navy.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/even.css?v=9">
  <script src="/assets/config.js?v=5"></script>
</head>
<body class="estimate-body">
  <main class="estimate">
    <div class="estimate-logo">
      <a href="/estimate" aria-label="Even Solutions — back to contact options">
        <img src="/images/logo-white.svg" alt="Even Solutions" width="1200" height="468">
      </a>
    </div>

    <section class="estimate-card quote-card" aria-labelledby="quote-title">
      <a href="/estimate" class="back-link" aria-label="Back to contact options">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back
      </a>
      <div class="rating" role="img" aria-label="Rated 5.0 out of 5 on Google">
        <img src="/images/google-g.svg" alt="" width="18" height="18">
        <b>5.0</b>
        <span class="stars" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#F2B134"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>
          <svg viewBox="0 0 24 24" fill="#F2B134"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>
          <svg viewBox="0 0 24 24" fill="#F2B134"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>
          <svg viewBox="0 0 24 24" fill="#F2B134"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>
          <svg viewBox="0 0 24 24" fill="#F2B134"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>
        </span>
      </div>

      <h1 id="quote-title">Get a Free Estimate</h1>
      <p class="lead">Tell us about your project. It takes about 30 seconds.</p>

      <form class="eform" id="quote-form" novalidate>
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="gclid"><input type="hidden" name="fbclid"><input type="hidden" name="gbraid"><input type="hidden" name="wbraid">
        <input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign">
        <input type="hidden" name="utm_content"><input type="hidden" name="utm_term">

        <label class="field"><span>Name</span>
          <input name="name" type="text" required maxlength="120" autocomplete="name" placeholder="John Smith"></label>
        <label class="field"><span>Mobile phone</span>
          <input name="phone" type="tel" required maxlength="40" autocomplete="tel" placeholder="(555) 123-4567"></label>
        <label class="field"><span>Email <em>(optional)</em></span>
          <input name="email" type="email" maxlength="254" autocomplete="email" placeholder="john@email.com"></label>
        <div class="row">
          <label class="field"><span>ZIP code</span>
            <input name="zipCode" type="text" required inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" autocomplete="postal-code" placeholder="34787"></label>
          <label class="field"><span>Service</span>
            <select name="service" required>
              <option value="" disabled selected>Select</option>
              <option>Flooring</option>
              <option>Interior Painting</option>
              <option>Exterior Painting</option>
              <option>Bathroom Remodel</option>
              <option>Accent Walls</option>
              <option>Demolition</option>
              <option>Other</option>
            </select></label>
        </div>

        <div class="sms-consent">
          <input type="checkbox" id="sms-consent" name="smsConsent" value="yes">
          <label for="sms-consent">Text me about my estimate, scheduling, and project updates from Even Solutions. Msg frequency varies. Msg &amp; data rates may apply. Reply HELP for help, STOP to opt out. Consent not required to buy.
            <a href="/sms-terms" target="_blank" rel="noopener">SMS Terms</a> · <a href="/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a></label>
        </div>

        <p class="error" role="alert" hidden></p>

        <button type="submit" class="ebtn"><span class="ebtn-label">Get My Free Estimate</span>
          <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0d182d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        </button>
      </form>

      <p class="consent">SMS is optional. Prefer to talk? Call <a href="tel:+16893336828" class="btn-call">(689) 333-6828</a></p>
      <p class="langs">We speak English · Português · Español</p>
    </section>
  </main>

  <script src="/assets/tracking.js?v=4"></script>
  <script>
    (function () {
      var C = window.EVEN_CONFIG || {};
      var form = document.getElementById('quote-form');
      var err = form.querySelector('.error');
      var btn = form.querySelector('button[type=submit]');
      var label = btn.querySelector('.ebtn-label');
      function showError(msg) { err.textContent = msg; err.hidden = false; }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.hidden = true;
        if (!form.checkValidity()) { showError('Please check the required fields.'); form.reportValidity(); return; }
        btn.disabled = true; label.textContent = 'Sending…';
        var data = Object.fromEntries(new FormData(form).entries());
        data.smsConsent = document.getElementById('sms-consent').checked; // optional, unchecked by default
        data.formPage = location.href;
        data.meta_event_id = window.EVEN_NEW_EVENT_ID ? window.EVEN_NEW_EVENT_ID() : String(Date.now());
        try { sessionStorage.setItem('even_lead_event_id', data.meta_event_id); sessionStorage.setItem('even_lead_service', data.service); } catch (e) {}
        fetch('/api/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || !j.ok) throw new Error(j.message || ''); return j; }); })
          .then(function () {
            if (typeof window.gtag === 'function') {
              gtag('event', 'generate_lead', { form_name: 'quick_form', service: data.service });
              if (C.adsConversions && C.adsConversions.lead_form) gtag('event', 'conversion', { send_to: C.adsConversions.lead_form });
            }
            location.href = '/thank-you';
          })
          .catch(function (x) {
            showError(x.message || 'Something went wrong. Please call us at ' + (C.phoneDisplay || '(689) 333-6828') + '.');
            btn.disabled = false; label.textContent = 'Get My Free Estimate';
          });
      });
    })();
  </script>
</body>
</html>
